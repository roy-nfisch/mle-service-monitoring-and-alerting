[project]
name = "mle-service-monitoring-and-alerting"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "fastapi>=0.142.2",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.5",
    "scikit-learn>=1.8,<1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
